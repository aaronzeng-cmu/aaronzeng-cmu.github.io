- title: Research Experience
  type: time_table
  contents:
    - title: Closed-loop Auditory Modulation of Cerebrospinal Fluid during Sleep
      institution: Lewis Lab, Massachusetts Institute of Technology, Cambridge, MA
      year: 09/2024 - Present
      description:
        - Develop a closed-loop neuromodulation system that performs real-time scalp-EEG filtering and machine-learning-based slow-oscillation phase prediction to deliver precisely timed auditory stimulation during sleep
        - Integrate simultaneous EEG-fMRI with electrophysiological and CSF-flow analyses to quantify stimulation-evoked brain and fluid dynamics across younger and older adults
        - Co-authored a Science Translational Medicine study showing that closed-loop auditory stimulation targeting sleep slow waves modulates cerebrospinal fluid flow in humans
      linkitems:
        - link: https://doi.org/10.1126/scitranslmed.aea5469
          linkname: Science Translational Medicine
    - title: Bayesian Ensemble Neural Decoding
      institution: Insanally Lab, University of Pittsburgh, Pittsburgh, PA
      year: 05/2023 - 08/2024
      description:
        - Developed a probabilistic ensemble neural decoder, combining inter-spike-interval-based conditional probabilities across multiple neurons to jointly predict behavioral trial conditions
        - Revealed that traditionally neglected non-classically responsive neurons interact with responsive neurons in learning, and that aggregating their population activity improved behavioral decoding accuracy from 60% to 65% during late-stage learning
    - title: Spiking Recurrent Neural Network Simulation of the Brain
      institution: Insanally Lab, University of Pittsburgh, Pittsburgh, PA
      year: 05/2023 - 08/2024
      description:
        - Built spiking recurrent neural-network models with 1000 units in Python and Julia under biological constraints to simulate cortical mechanisms underlying auditory discrimination behavior
        - Investigated how flexible neural-network dynamics emerge from balanced excitatory and inhibitory activity and authored a manuscript describing the resulting computational model
    - title: Neural Probe Waveguide Characterization System
      institution: Chamanzar Lab, Carnegie Mellon University, Pittsburgh, PA
      year: 05/2022 - 04/2023
      description:
        - Developed an automated, non-destructive characterization system for photonic waveguides used in neural optical probes by integrating robotics, computer vision, and signal processing
        - Demonstrated waveguide-loss characterization previously achievable primarily through destructive methods and first-authored a peer-reviewed conference proceedings paper describing the pipeline
    - title: Adaptive Neural Signal Noise Cancellation
      institution: Lerman Lab, UC San Diego, La Jolla, CA
      year: 03/2020 - 01/2021
      description:
        - Led development of an adaptive filtering algorithm for suppressing power-line interference in peripheral nerve recordings and implemented the method in a hardware demonstration
        - Achieved approximately 45 dB suppression of 60 Hz interference and presented the work as first author at the North American Neuromodulation Society meeting
    - title: Peripheral Nerve Magnetoneurography
      institution: Lerman Lab, UC San Diego, La Jolla, CA
      year: 03/2020 - 01/2021
      description:
        - Developed MATLAB signal-cleaning and processing pipelines for magnetic measurements of peripheral nerve activity, contributing analyses to a collaborative publication
        - Supported human neuroscience studies involving peripheral nerve measurements and electrical stimulation
    - title: Automated Fluorescence Cell Counting
      institution: Spitzer Lab, UC San Diego, La Jolla, CA
      year: 10/2019 - 12/2020
      description:
        - Developed an automatic cell recognition program for fluorescence brain slices in Matlab utilizing correlation to count and map a variety of brain cells, obtaining an accuracy close to expert manual selection
    - title: Neural Recording Amplifier PCB Design
      institution: Neuroelectronics Group, La Jolla, San Diego, CA
      year: 07/2019 - 08/2019
      description:
        - Designed, assembled, and tested an Altium PCB for an amplifier used in in vivo neural recording
        - Reduced the redesigned amplifier-board footprint to approximately 3 cm x 1 cm, more than twofold smaller than the previous design

