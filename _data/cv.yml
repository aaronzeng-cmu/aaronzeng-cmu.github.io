- title: Research Experience
  type: time_table
  contents:
    - title: Closed-loop Auditory Modulation of Cerebrospinal Fluid during Sleep
      institution: Lewis Lab, Massachusetts Institute of Technology, Cambridge, MA
      year: 09/2024 - Present
      description:
        - Develop real-time EEG processing and machine-learning-based slow-oscillation phase-prediction algorithms for precisely timed closed-loop auditory stimulation during sleep
        - Integrate simultaneous EEG-fMRI with electrophysiological and CSF-flow measurements to quantify stimulation-evoked neural and physiological dynamics across younger and older adults
        - Co-authored a Science Translational Medicine paper showing that closed-loop auditory stimulation in phase with sleep slow waves enhances cerebrospinal fluid flow in humans
      linkitems:
        - link: https://doi.org/10.1126/scitranslmed.aea5469
          linkname: Science Translational Medicine
    - title: Robust Automatic Sleep Staging for Simultaneous EEG-fMRI
      institution: Lewis Lab, Massachusetts Institute of Technology, Cambridge, MA
      year: 09/2024 - Present
      description:
        - Benchmark automatic sleep-staging models on manually staged simultaneous EEG-fMRI and characterize systematic failures under scanner-domain shift
        - Investigate contributions from temporal and context priors, sensor and reference mismatch, and scanner-related signal differences
    - title: Bayesian Ensemble Neural Decoding
      institution: Insanally Lab, University of Pittsburgh, Pittsburgh, PA
      year: 05/2023 - 08/2024
      description:
        - Developed a probabilistic ensemble neural decoder that combines inter-spike-interval conditional probabilities across neurons to predict behavioral trial conditions
        - Showed that non-classically responsive neurons interact with responsive neurons during learning, and that aggregating their population activity raised behavioral decoding accuracy from 60% to 65% in late-stage learning
    - title: Biologically Constrained Spiking Recurrent Neural Networks
      institution: Insanally Lab, University of Pittsburgh, Pittsburgh, PA
      year: 05/2023 - 08/2024
      description:
        - Built 1,000-unit spiking recurrent neural-network models in Python and Julia under biological constraints to simulate cortical dynamics underlying auditory discrimination
        - Investigated how flexible network dynamics emerge from balanced excitatory and inhibitory activity
    - title: Neural Probe Waveguide Characterization System
      institution: Chamanzar Lab, Carnegie Mellon University, Pittsburgh, PA
      year: 05/2022 - 04/2023
      description:
        - Developed an automated neural-probe waveguide characterization pipeline integrating computer vision, robotics, and signal processing
        - Enabled non-destructive loss measurement previously achievable primarily through destructive methods, and first-authored a peer-reviewed conference proceedings paper
    - title: Adaptive Neural Signal Noise Cancellation
      institution: Lerman Lab, UC San Diego, La Jolla, CA
      year: 03/2020 - 01/2021
      description:
        - Developed and hardware-validated an adaptive filtering algorithm for peripheral nerve recordings, achieving approximately 45 dB suppression of 60 Hz interference
        - Presented the work as first author at the North American Neuromodulation Society meeting
    - title: Peripheral Nerve Magnetoneurography
      institution: Lerman Lab, UC San Diego, La Jolla, CA
      year: 03/2020 - 01/2021
      description:
        - Created signal cleaning and processing scripts in Matlab for experiment data on magnetic nervous system recordings by tailoring functions to individual signal, contributing to publication of another paper
        - Ran test subject for human trials in neuroscience studies involving electric stimulation
    - title: Automated Fluorescence Cell Counting
      institution: Spitzer Lab, UC San Diego, La Jolla, CA
      year: 10/2019 - 12/2020
      description:
        - Developed an automatic cell recognition program for fluorescence brain slices in Matlab utilizing correlation to count and map a variety of brain cells
        - Obtained an accuracy that's close to expert's manual selection
    - title: Neural Recording Amplifier PCB Design
      institution: Neuroelectronics Group, La Jolla, San Diego, CA
      year: 07/2019 - 08/2019
      description:
        - Created and soldered a PCB design using Altium for an amplifier chip to be used in in vivo cell recording
        - Produced a miniature board with size 3cm×1cm and more than two times smaller than previous design

