- title: Research Experience
  type: time_table
  contents:
    - title: Closed-loop Auditory Modulation of Cerebrospinal Fluid during Sleep
      institution: Lewis Lab, Massachusetts Institute of Technology, Cambridge, MA
      year: 09/2024 - Present
      description:
        - Design machine-learning-based algorithms to use auditory stimulation to promote cerebrospinal fluid circulation during sleep to enhance waste clearance
        - Suggest new potential intervention for brain aging which does not exist in the field
        - Present results at conference as first author
    - title: Bayesian Ensemble Neural Decoding
      institution: Insanally Lab, University of Pittsburgh, Pittsburgh, PA
      year: 05/2023 - 08/2024
      description:
        - Developed an ensemble decoder in Python that incorporates information from multiple neurons to predict mouse behavior in auditory discrimination tasks
        - Revealed the significance of non-classically-response neurons in task learning, and published the findings in a paper in review
    - title: Spiking Recurrent Neural Network Simulation of the Brain
      institution: Insanally Lab, University of Pittsburgh, Pittsburgh, PA
      year: 05/2023 - 08/2024
      description:
        - Designed a spiking Recurrent Neural Network in Python and Julia that follows biological constraints to simulate cerebral mechanisms in mouse auditory discrimination tasks
        - Expanded the simulation to discover how a flexible network is attained in long-term training, and first authored a paper in preparation
    - title: Neural Probe Waveguide Characterization System
      institution: Chamanzar Lab, Carnegie Mellon University, Pittsburgh, PA
      year: 05/2022 - 04/2023
      description:
        - Created a neural optical probe characterization system based on light scattering, incorporating robotics, computer vision, and signal processing
        - Published a characterization performance that's previously only obtainable by destructive methods as first author
    - title: Adaptive Neural Signal Noise Cancellation
      institution: Lerman Lab, UC San Diego, La Jolla, CA
      year: 03/2020 - 01/2021
      description:
        - Led research and implementation of an adaptive filtering algorithm to eliminate powerline noise contaminating peripheral nerve recordings
        - Prototyped a hardware demo achieving 45dB noise reduction in 60Hz band, and presented a conference paper on project as first author
    - title: Peripheral Nerve Magnetoneurography
      institution: Lerman Lab, UC San Diego, La Jolla, CA
      year: 03/2020 - 01/2021
      description:
        - Created signal cleaning and processing scripts in Matlab for experiment data on magnetic nervous system recordings by tailoring functions to individual signal, contributing to publication of another paper
        - Ran test subject for human trials in neuroscience studies involving electric stimulation
    - title: Automated Fluorescence Cell Counting
      institution: Spitzer Lab, UC San Diego, La Jolla, CA
      year: 10/2019 - 12/2020
      description:
        - Developed an automatic cell recognition program for fluorescence brain slices in Matlab utilizing correlation to count and map a variety of brain cells
        - Obtained an accuracy that's close to expert's manual selection
    - title: Neural Recording Amplifier PCB Design
      institution: Neuroelectronics Group, La Jolla, San Diego, CA
      year: 07/2019 - 08/2019
      description:
        - Created and soldered a PCB design using Altium for an amplifier chip to be used in in vivo cell recording
        - Produced a miniature board with size 3cm×1cm and more than two times smaller than previous design

